name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Fyne needs CGO and native OpenGL/X11/WebKit dev libraries, so each target is
# built on a native runner of the same OS. Builds are ad-hoc unsigned; macOS
# binaries require the Gatekeeper workaround documented in README.md.

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native GUI libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/v6ddns .
          tar -C dist -czf dist/v6ddns-${GITHUB_REF_NAME}-linux-amd64.tar.gz v6ddns
          rm dist/v6ddns
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin-amd64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/v6ddns .
          tar -C dist -czf dist/v6ddns-${GITHUB_REF_NAME}-darwin-amd64.tar.gz v6ddns
          rm dist/v6ddns
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-darwin-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/v6ddns .
          tar -C dist -czf dist/v6ddns-${GITHUB_REF_NAME}-darwin-arm64.tar.gz v6ddns
          rm dist/v6ddns
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o dist/v6ddns.exe .
          (cd dist && zip -q v6ddns-${GITHUB_REF_NAME}-windows-amd64.zip v6ddns.exe)
          rm dist/v6ddns.exe
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux-amd64, build-darwin-amd64, build-darwin-arm64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

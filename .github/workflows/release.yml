name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# The tray uses pure Go on Windows and Linux (CGO_ENABLED=0) and Cocoa on macOS,
# which needs cgo and a native macOS runner. Builds are ad-hoc unsigned; macOS
# binaries require the Gatekeeper workaround documented in README.md.

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/v6ddns .
          tar -C dist -czf dist/v6ddns-${GITHUB_REF_NAME}-linux-amd64.tar.gz v6ddns
          rm dist/v6ddns
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin-amd64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/v6ddns .
          tar -C dist -czf dist/v6ddns-${GITHUB_REF_NAME}-darwin-amd64.tar.gz v6ddns
          rm dist/v6ddns
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-darwin-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/v6ddns .
          tar -C dist -czf dist/v6ddns-${GITHUB_REF_NAME}-darwin-arm64.tar.gz v6ddns
          rm dist/v6ddns
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-darwin-arm64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-s -w -X main.version=$env:GITHUB_REF_NAME -H=windowsgui" -o dist/v6ddns.exe .
          Compress-Archive -Path dist/v6ddns.exe -DestinationPath "dist/v6ddns-${env:GITHUB_REF_NAME}-windows-amd64.zip"
          Remove-Item dist/v6ddns.exe
      - uses: actions/upload-artifact@v4
        with:
          name: v6ddns-windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux-amd64, build-darwin-amd64, build-darwin-arm64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BIN=v6ddns
          if [ "$GOOS" = "windows" ]; then BIN=v6ddns.exe; fi
          go build -trimpath -ldflags="-s -w" -o "dist/${BIN}" .
          ARCHIVE=v6ddns-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q "${ARCHIVE}.zip" "${BIN}")
            echo "ASSET=dist/${ARCHIVE}.zip" >> "$GITHUB_ENV"
          else
            tar -C dist -czf "dist/${ARCHIVE}.tar.gz" "${BIN}"
            echo "ASSET=dist/${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v6ddns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
